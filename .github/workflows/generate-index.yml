name: Generate index.html

on:
  push:
    paths:
      - '**.html'
      - '!index.html'          # 避免自己触发自己

permissions:
  contents: write              # 允许提交

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.html
        shell: bash
        run: |
          python3 << 'EOF'
          import os
          from glob import glob
          from urllib.parse import quote
          from datetime import datetime, timezone, timedelta

          html_files = []

          for f in glob('**/*.html', recursive=True):
              if f == 'index.html':
                  continue
              # 直接使用文件名（不含 .html）作为链接文字
              title = os.path.splitext(os.path.basename(f))[0]
              html_files.append((f, title))

          # 按文件路径排序，方便浏览
          html_files.sort(key=lambda x: x[0])

          # 使用上海时区（UTC+8）
          shanghai_tz = timezone(timedelta(hours=8))
          now = datetime.now(shanghai_tz).strftime('%Y-%m-%d %H:%M:%S 北京时间')

          links = '\n'.join(
              f'<li><a href="{quote(f, safe="/")}">{title}</a></li>'
              for f, title in html_files
          )

          html = f"""<!DOCTYPE html>
          <html lang="zh">
          <head><meta charset="utf-8"><title>已保存的页面</title></head>
          <body>
          <h1>已保存的页面</h1>
          <p>生成时间：{now}</p>
          <ul>
          {links}
          </ul>
          </body>
          </html>"""

          with open('index.html', 'w', encoding='utf-8') as out:
              out.write(html)
          print('index.html 生成完毕')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新 index.html [skip ci]"
            git push
          fi
