name: Generate index.html

on:
  push:
    paths:
      - '**.html'
      - '!index.html'          # 避免自己触发自己

permissions:
  contents: write              # 允许提交

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.html
        shell: bash
        run: |
          python3 << 'EOF'
          import os, re
          from glob import glob
          from urllib.parse import quote
          from datetime import datetime, timezone, timedelta

          def extract_time(filename):
              # 匹配 (2026_5_13 14：47：52) 这类格式，冒号可能是全角或半角
              m = re.search(r'\((\d+)_(\d+)_(\d+)\s+(\d+)[：:](\d+)[：:](\d+)\)', filename)
              if m:
                  try:
                      y, mon, d, h, mi, s = map(int, m.groups())
                      return datetime(y, mon, d, h, mi, s)
                  except:
                      pass
              return datetime.min  # 无法提取的排到最后

          html_files = []

          for f in glob('**/*.html', recursive=True):
              if f == 'index.html':
                  continue
              title = os.path.splitext(os.path.basename(f))[0]
              html_files.append((f, title))

          # 按提取的时间降序排列（最新的在前）
          html_files.sort(key=lambda x: extract_time(x[1]), reverse=True)

          # 使用上海时区（UTC+8）
          shanghai_tz = timezone(timedelta(hours=8))
          now = datetime.now(shanghai_tz).strftime('%Y-%m-%d %H:%M:%S 上海时间')

          links = '\n'.join(
              f'<li><a href="{quote(f, safe="/")}">{title}</a></li>'
              for f, title in html_files
          )

          html = f"""<!DOCTYPE html>
          <html lang="zh">
          <head><meta charset="utf-8"><title>已保存的页面</title></head>
          <body>
          <h1>已保存的页面</h1>
          <p>生成时间：{now}</p>
          <ul>
          {links}
          </ul>
          </body>
          </html>"""

          with open('index.html', 'w', encoding='utf-8') as out:
              out.write(html)
          print('index.html 生成完毕')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新 index.html [skip ci]"
            git push
          fi
